<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meus Sonhos na TI</title>
    <style>
        body {
            background-color: #111;
            color: white;
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 30px;
        }
        h1 { color: #007bff; font-size: 28px; }
        p { color: #ccc; font-size: 18px; }
        .container {
            display: flex;
            justify-content: center;
            gap: 20px;
            flex-wrap: wrap;
            margin-top: 30px;
        }
        .card {
            background-color: #222;
            border: 2px solid #333;
            border-radius: 10px;
            padding: 15px;
            width: 300px;
        }
        .card img {
            width: 100%;
            border-radius: 8px;
            height: 200px;
            object-fit: cover;
        }
        .carro-titulo {
            font-size: 20px;
            font-weight: bold;
            margin-top: 15px;
            color: #ff4757;
        }
    </style>
</head>
<body>

    <h1>Primeiro Site do Futuro Programador</h1>
    <p>Tenho 15 anos e acabei de começar minha jornada na tecnologia rumo ao topo!</p>
    
    <div class="container">
        <div class="card">
            <img src="https://tcdn.com.br" alt="Golf GTI">
            <div class="carro-titulo">🚘 Meta 1: Golf GTI</div>
        </div>
        <div class="card">
            <img src="https://miamiimports.com.br" alt="BMW 320i">
            <div class="carro-titulo">🏎️ Meta 2: BMW da Família</div>
        </div>
    </div>

</body>
</html>
